<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0B0D">
<title>404 — Joaquin Galang</title>
<meta name="description" content="That page doesn't exist. Here's the way back to Joaquin Galang's portfolio.">
<meta name="robots" content="noindex">
<link rel="icon" href="/portfolio_icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500&amp;family=Poppins:wght@300;400;500&amp;family=Sarpanch:wght@700;800&amp;display=swap">
<!--
  A static page rather than a React route: the site is a single-page app with no
  router, so it cannot render a 404 for an unknown path, and anything that waits
  for JS would flash blank first. Vercel serves this file with a real 404 status
  for unmatched paths, which is also what search engines need to see.

  Palette, type and motion are copied from `.impeccable.md` and `src/index.css`.
  If those change, change them here too.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --base: #0B0B0D;
    --surface: #141515;
    --elevated: #1B1D1C;
    --accent: #60e08e;
    --text: #F6F7FF;
    --text-70: rgba(246, 247, 255, 0.70);
    --text-45: rgba(246, 247, 255, 0.45);
    --hairline: rgba(246, 247, 255, 0.10);
    --expo: cubic-bezier(0.16, 1, 0.3, 1);
    --quart: cubic-bezier(0.25, 1, 0.5, 1);
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 1.5rem;
    background: var(--base);
    color: var(--text);
    font-family: Poppins, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    -webkit-tap-highlight-color: transparent;
  }

  /* The site's one focus indicator. Never removed, only restyled. */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 4px;
  }

  ::selection { background: var(--accent); color: var(--base); }

  main {
    width: 100%;
    max-width: 34rem;
    text-align: center;
    animation: reveal 0.6s var(--expo) both;
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Matches the site's SectionLabel eyebrow. */
  .eyebrow {
    margin: 0;
    font-size: 0.75rem;
    font-weight: 300;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--accent);
  }

  /* The accent is used sparingly elsewhere, so the numeral stays in text colour
     and earns its weight from scale instead. */
  .code {
    margin: 0.75rem 0 0;
    font-family: Sarpanch, ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(4.5rem, 3rem + 7.5vw, 8rem);
    line-height: 1;
    letter-spacing: -0.03em;
  }

  h1 {
    margin: 0.5rem 0 0;
    font-family: "Chakra Petch", ui-sans-serif, system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(1.25rem, 1.05rem + 1vw, 1.75rem);
    line-height: 1.25;
  }

  .lede {
    margin: 0.9rem auto 0;
    max-width: 34ch;
    font-size: 0.95rem;
    line-height: 1.65;
    color: var(--text-70);
  }

  /* The requested path, shown the way a developer would expect to see it.
     Filled in by script; stays hidden when JS is unavailable. */
  .path {
    display: none;
    margin: 1.5rem auto 0;
    max-width: 100%;
    padding: 0.7rem 1rem;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    background: var(--surface);
    font-family: "Chakra Petch", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8125rem;
    color: var(--text-45);
    overflow-x: auto;
    white-space: nowrap;
  }

  .path[data-filled] { display: block; }
  .path .verb { color: var(--accent); }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
    margin-top: 2rem;
  }

  /* Same two button variants as src/components/Button.tsx. */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    min-height: 44px;
    padding: 0 1.5rem;
    border-radius: 999px;
    font-size: 0.9375rem;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.2s var(--quart), border-color 0.2s var(--quart),
                color 0.2s var(--quart), transform 0.2s var(--quart);
  }

  .btn:active { transform: scale(0.98); }

  .btn-primary {
    background: var(--accent);
    color: var(--base);
    font-weight: 500;
    border: 1px solid var(--accent);
  }

  .btn-secondary {
    border: 1px solid rgba(246, 247, 255, 0.15);
    background: rgba(246, 247, 255, 0.05);
    color: var(--text);
    font-weight: 400;
  }

  @media (hover: hover) {
    .btn-primary:hover { background: rgba(96, 224, 142, 0.9); transform: translateY(-2px); }
    .btn-secondary:hover {
      background: rgba(246, 247, 255, 0.10);
      border-color: rgba(96, 224, 142, 0.5);
      color: var(--accent);
      transform: translateY(-2px);
    }
  }

  /* Recovery paths: an error without a way out is the actual failure. */
  .jump {
    margin-top: 2.5rem;
    padding-top: 1.75rem;
    border-top: 1px solid var(--hairline);
  }

  .jump-label {
    margin: 0 0 1rem;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--text-45);
  }

  .jump-links {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 1rem;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: var(--surface);
    color: var(--text-70);
    font-size: 0.875rem;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.2s var(--quart), color 0.2s var(--quart),
                border-color 0.2s var(--quart);
  }

  .chip:active { background: var(--elevated); }

  @media (hover: hover) {
    .chip:hover {
      background: var(--elevated);
      border-color: rgba(96, 224, 142, 0.35);
      color: var(--text);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .btn-primary:hover, .btn-secondary:hover { transform: none; }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">error</p>
  <p class="code" aria-hidden="true">404</p>

  <h1>This page doesn&rsquo;t exist</h1>
  <p class="lede">
    The link may be broken, or the page may have moved. Nothing is lost &mdash;
    here&rsquo;s the way back.
  </p>

  <p class="path" id="path"><span class="verb">GET</span> <span id="path-value"></span></p>

  <div class="actions">
    <a class="btn btn-primary" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>
      Back to home
    </a>
    <a class="btn btn-secondary" href="/#contact-section">Get in touch</a>
  </div>

  <nav class="jump" aria-labelledby="jump-label">
    <p class="jump-label" id="jump-label">Or jump straight to</p>
    <div class="jump-links">
      <a class="chip" href="/#about-section">About</a>
      <a class="chip" href="/#projects-section">Projects</a>
      <a class="chip" href="/#involvement-section">Involvement</a>
      <a class="chip" href="/#awards-section">Awards</a>
    </div>
  </nav>
</main>

<script>
  // Progressive enhancement: shows what was actually requested, which is the
  // first thing anyone wants to see on a 404. Written with textContent, never
  // innerHTML — the path is attacker-controlled and must never be parsed as HTML.
  (function () {
    var value = document.getElementById('path-value');
    var wrap = document.getElementById('path');
    if (!value || !wrap) return;
    var path = (location.pathname || '/') + (location.search || '');
    value.textContent = path.length > 64 ? path.slice(0, 61) + '…' : path;
    wrap.setAttribute('data-filled', '');
  })();
</script>
</body>
</html>
