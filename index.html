    <script>
      (function () {
        if (location.pathname !== '/' || location.search) return;
        var ua = navigator.userAgent;
        if (/ipad|tablet|playbook|silk|(android(?!.*mobile))/i.test(ua)) return;
        if (!/mobi|iphone|ipod|android|blackberry|iemobile|opera mini/i.test(ua)) return;
        var answered = false;
        try { answered = localStorage.getItem('cg') === '1'; } catch (e) {}
        location.replace(answered ? '/c?v=1' : '/c');
      })();
    </script>
